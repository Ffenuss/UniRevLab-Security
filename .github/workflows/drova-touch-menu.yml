name: Build Drova touch menu

on:
  workflow_dispatch:
  push:
    branches: [codex/drova-touch-menu]
    paths:
      - 'tools/drova-bedocompat/**'
      - '.github/workflows/drova-touch-menu.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install NDK and CMake
        run: sdkmanager 'ndk;26.3.11579264' 'cmake;3.22.1'
      - name: Build ARM64 libraries
        working-directory: tools/drova-bedocompat
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: drova-touch-menu-arm64
          path: tools/drova-bedocompat/output/*
          if-no-files-found: error
