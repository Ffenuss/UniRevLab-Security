name: Build ModKit 0.9.0-dev11 APK

on:
  push:
    branches: [ Modkit1 ]
    paths:
      - 'ModKit-Android-0.9.0-dev10-sources.zip'
      - '.ci/patch_modkit_android_compat.py'
      - '.ci/ModKit-dev10-exact-to-dev11.patch.gz.b64'
      - '.ci/ModKit-dev11.manifest.txt'
      - '.github/workflows/modkit-dev11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-modkit-dev11:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NDK_PIN: 26.3.11579264
      MODKIT_DIR: /tmp/modkit-dev11
      DEV11_PATCH: /tmp/ModKit-dev11.patch
      DEV11_PATCH_SHA256: 46ca0c8fc395e75a3bdbdc7d75cd7d12743b371c7b98c6a9b89ac0e7ca91ca33
      BASE_SHA256: 71b51b27b63a75653b68a81de6feadc337e2dbe5e6b8ef521aa5082601009cef
    steps:
      - name: Checkout Modkit1
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            "ndk;${NDK_PIN}" \
            'cmake;3.22.1'

      - name: Reconstruct exact ModKit dev11 sources
        shell: bash
        run: |
          set -euo pipefail
          echo "${BASE_SHA256}  ModKit-Android-0.9.0-dev10-sources.zip" | sha256sum -c -
          rm -rf "${MODKIT_DIR}"
          mkdir -p "${MODKIT_DIR}"
          unzip -q ModKit-Android-0.9.0-dev10-sources.zip -d "${MODKIT_DIR}"
          test -f "${MODKIT_DIR}/android/settings.gradle"
          test -f "${MODKIT_DIR}/android/app/build.gradle"

          python .ci/patch_modkit_android_compat.py "${MODKIT_DIR}"

          echo "3a1a65cc59a695e59bc1bfc678cf4f88ab207b623efb3a6523cff0abbc707047  .ci/ModKit-dev10-exact-to-dev11.patch.gz.b64" | sha256sum -c -
          base64 --decode .ci/ModKit-dev10-exact-to-dev11.patch.gz.b64 | gunzip > "${DEV11_PATCH}"
          echo "${DEV11_PATCH_SHA256}  ${DEV11_PATCH}" | sha256sum -c -

          cd "${MODKIT_DIR}"
          git apply --check "${DEV11_PATCH}"
          git apply "${DEV11_PATCH}"

          grep -q "versionCode 18" android/app/build.gradle
          grep -q "versionName '0.9.0-dev11'" android/app/build.gradle
          grep -q 'version = "0.9.0.dev11"' pyproject.toml

      - name: Python regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          cd "${MODKIT_DIR}"
          python -m pytest tests -q

      - name: ModKit selftest
        shell: bash
        run: |
          set -euo pipefail
          cd "${MODKIT_DIR}"
          python -m modkit selftest

      - name: Runtime C++ contract check
        shell: bash
        run: |
          set -euo pipefail
          cd "${MODKIT_DIR}"
          python -m modkit runtime-check

      - name: Build APK and lint
        shell: bash
        run: |
          set -euo pipefail
          cd "${MODKIT_DIR}/android"
          gradle --no-daemon :app:assembleDebug :app:lintDebug

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "${MODKIT_DIR}/android/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "${APK}"
          test -s "${APK}"
          unzip -t "${APK}" >/dev/null
          "${ANDROID_HOME}/build-tools/34.0.0/zipalign" -c -p -v 4 "${APK}" >/dev/null
          cp "${APK}" ModKit-Android-0.9.0-dev11-debug.apk
          sha256sum ModKit-Android-0.9.0-dev11-debug.apk | tee ModKit-Android-0.9.0-dev11-debug.apk.sha256
          ls -lh ModKit-Android-0.9.0-dev11-debug.apk

      - name: Upload ModKit dev11 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModKit-Android-0.9.0-dev11-debug
          path: |
            ModKit-Android-0.9.0-dev11-debug.apk
            ModKit-Android-0.9.0-dev11-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
