name: Wire ModKit v1 Artifact Cards

on:
  push:
    branches: [ Modkit1 ]
    paths:
      - '.github/workflows/v1-wire-artifact-cards.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Modkit1
      - name: Add artifact-family evidence to Simple Mode
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v1/modkit/mobile/simple_mode.py')
          s=p.read_text(encoding='utf-8')
          anchor='''    if isinstance(security, dict):\n        add(_security_summary(security, "endpoints", "Network / API Endpoints", "Найдены статические API/HTTP/WebSocket/host:port точки. Откройте детали для уникальных endpoint и точных файлов."))\n        add(_security_summary(security, "crypto", "Crypto / Key Handling", "Найдены crypto/key-handling и TLS pinning markers. Это карта кода, а не доказательство утечки секретного ключа."))\n\n'''
          block='''    artifacts = _json(root / "artifact-families.json")\n    if isinstance(artifacts, dict):\n        for row in artifacts.get("artifacts", []) or []:\n            if not isinstance(row, dict):\n                continue\n            card = _generic_card(row, "ArtifactFamily", "Runtime/Script")\n            if card:\n                card["ownership"] = "APP_OR_GAME"\n                family = str(row.get("family") or "runtime")\n                recovery = str(row.get("recoveryLevel") or "FOUND_STATIC")\n                card["description"] = f"{family} · {recovery}. Артефакт найден во всех выбранных APK/split; symbols/strings участвуют в gameplay-поиске."\n                add(_quality(card))\n\n'''
          if block not in s:
              if anchor not in s: raise SystemExit('security anchor not found')
              s=s.replace(anchor,anchor+block)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'ModKit CI'
          git config user.email 'actions@users.noreply.github.com'
          git add v1/modkit/mobile/simple_mode.py
          git diff --cached --quiet && exit 0
          git commit -m 'v1: surface script runtime evidence in Simple Mode'
          git push origin HEAD:Modkit1
