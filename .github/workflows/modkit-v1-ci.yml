name: ModKit v1 Canonical CI

on:
  push:
    branches: [ Modkit1 ]
    paths:
      - 'v1/**'
      - '.github/workflows/modkit-v1-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modkit-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      NDK_PIN: 26.1.10909125
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android toolchain
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' "ndk;${NDK_PIN}" 'cmake;3.22.1'
      - name: Python tests and runtime guards
        working-directory: v1
        run: |
          set -euo pipefail
          python -m pip install -U pip pytest
          python -m pytest tests -q
          python -m modkit selftest
          python -m modkit runtime-check
      - name: Android unit tests
        working-directory: v1/android
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Android Java compile
        working-directory: v1/android
        run: gradle --no-daemon :app:compileDebugJavaWithJavac
      - name: Android lint
        working-directory: v1/android
        run: gradle --no-daemon :app:lintDebug
      - name: Android assemble
        working-directory: v1/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK container, alignment and signature
        working-directory: v1
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "${ANDROID_HOME}/build-tools/34.0.0/zipalign" -c -p -v 4 "$APK" >/dev/null
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          sha256sum "$APK" | tee ModKit-Android-1.1.0-dev1-debug.apk.sha256
          test "$(unzip -p "$APK" AndroidManifest.xml | wc -c)" -gt 0
      - name: Upload validated APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModKit-Android-1.1.0-dev1-debug
          path: |
            v1/android/app/build/outputs/apk/debug/app-debug.apk
            v1/ModKit-Android-1.1.0-dev1-debug.apk.sha256
            v1/apk-signature.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
