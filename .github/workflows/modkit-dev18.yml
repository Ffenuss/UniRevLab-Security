name: Build ModKit 0.9.0-dev18 APK

on:
  push:
    branches: [ Modkit1 ]
    paths:
      - '.ci/dev18-patch/**'
      - '.github/workflows/modkit-dev18.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-modkit-dev18:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NDK_PIN: 26.3.11579264
      MODKIT_DIR: /tmp/modkit-dev18
      DEV11_PATCH_GZ: /tmp/ModKit-dev11.patch.gz
      DEV11_PATCH: /tmp/ModKit-dev11.patch
      DEV11_PATCH_GZ_SHA256: a884617ea250eceaecc1a8b6e6788ba14cfbbe93249446667f7595d3120af922
      DEV11_PATCH_SHA256: 46ca0c8fc395e75a3bdbdc7d75cd7d12743b371c7b98c6a9b89ac0e7ca91ca33
      BASE_SHA256: 71b51b27b63a75653b68a81de6feadc337e2dbe5e6b8ef521aa5082601009cef
      DEV16_PATCH_GZ_SHA256: f679898195a7bec5d8a9d0ff4836c7befbb9ac4fb9c8d142b8868fb1e5810b27
      DEV16_PATCH_SHA256: 67a3a1cd456b13216395bbff87c73e4eb652dd9f62770d59da9404fd3f4a01ac
      DEV17_PATCH_GZ_SHA256: 5a2de96d1a1f741d3ff8f2f9cd370a08ae6ca61ba797b09ab5b9c848a94734a4
      DEV17_PATCH_SHA256: c02062c391320b50b82bdb5fc859ad45650afcd4ca5f2b9d8ac8f66cd5647736
      DEV18_PATCH_GZ_SHA256: d42eb5275284337b5051c98859dbb9bdb5cc16e8ac0b666a594bbb0b71a884c2
      DEV18_PATCH_SHA256: 3136b2d3edcb8523f3bb6ca401b9198d3f117d996f03e7fce3fddac574da4654
    steps:
      - name: Checkout Modkit1
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' "ndk;${NDK_PIN}" 'cmake;3.22.1'

      - name: Reconstruct exact ModKit dev11 base
        shell: bash
        run: |
          set -euo pipefail
          echo "${BASE_SHA256}  ModKit-Android-0.9.0-dev10-sources.zip" | sha256sum -c -
          rm -rf "${MODKIT_DIR}" && mkdir -p "${MODKIT_DIR}"
          unzip -q ModKit-Android-0.9.0-dev10-sources.zip -d "${MODKIT_DIR}"
          python .ci/patch_modkit_android_compat.py "${MODKIT_DIR}"
          cat .ci/dev11-patch/part00.gz.part .ci/dev11-patch/part01.gz.part .ci/dev11-patch/part02.gz.part .ci/dev11-patch/part03.gz.part > "${DEV11_PATCH_GZ}"
          echo "${DEV11_PATCH_GZ_SHA256}  ${DEV11_PATCH_GZ}" | sha256sum -c -
          gunzip -c "${DEV11_PATCH_GZ}" > "${DEV11_PATCH}"
          echo "${DEV11_PATCH_SHA256}  ${DEV11_PATCH}" | sha256sum -c -
          cd "${MODKIT_DIR}" && git apply --check "${DEV11_PATCH}" && git apply "${DEV11_PATCH}"

      - name: Apply exact dev16 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/dev16-patch/part*.b64.part | tr -d '\r\n\t ' | base64 --decode > /tmp/ModKit-dev16.patch.gz
          echo "${DEV16_PATCH_GZ_SHA256}  /tmp/ModKit-dev16.patch.gz" | sha256sum -c -
          gunzip -c /tmp/ModKit-dev16.patch.gz > /tmp/ModKit-dev16.patch
          echo "${DEV16_PATCH_SHA256}  /tmp/ModKit-dev16.patch" | sha256sum -c -
          cd "${MODKIT_DIR}" && git apply --check /tmp/ModKit-dev16.patch && git apply /tmp/ModKit-dev16.patch

      - name: Apply exact dev17 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/dev17-patch/part*.b64.part | tr -d '\r\n\t ' | base64 --decode > /tmp/ModKit-dev17.patch.gz
          echo "${DEV17_PATCH_GZ_SHA256}  /tmp/ModKit-dev17.patch.gz" | sha256sum -c -
          gunzip -c /tmp/ModKit-dev17.patch.gz > /tmp/ModKit-dev17.patch
          echo "${DEV17_PATCH_SHA256}  /tmp/ModKit-dev17.patch" | sha256sum -c -
          cd "${MODKIT_DIR}" && git apply --check /tmp/ModKit-dev17.patch && git apply /tmp/ModKit-dev17.patch

      - name: Apply dev18 split-IL2CPP bridge patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/dev18-patch/part*.b64.part | tr -d '\r\n\t ' | base64 --decode > /tmp/ModKit-dev18.patch.gz
          echo "${DEV18_PATCH_GZ_SHA256}  /tmp/ModKit-dev18.patch.gz" | sha256sum -c -
          gunzip -c /tmp/ModKit-dev18.patch.gz > /tmp/ModKit-dev18.patch
          echo "${DEV18_PATCH_SHA256}  /tmp/ModKit-dev18.patch" | sha256sum -c -
          cd "${MODKIT_DIR}"
          git apply --check /tmp/ModKit-dev18.patch
          git apply /tmp/ModKit-dev18.patch
          grep -q "versionCode 25" android/app/build.gradle
          grep -q "versionName '0.9.0-dev18'" android/app/build.gradle
          grep -q 'version = "0.9.0.dev18"' pyproject.toml
          grep -q '__version__ = "0.9.0-dev18"' modkit/__init__.py
          test -f VALIDATION-DEV18.json

      - name: Stage exact dev18 sources
        shell: bash
        run: |
          set -euo pipefail
          tar -C "${MODKIT_DIR}" -czf ModKit-Android-0.9.0-dev18-exact-sources.tar.gz .
          sha256sum ModKit-Android-0.9.0-dev18-exact-sources.tar.gz | tee ModKit-Android-0.9.0-dev18-exact-sources.tar.gz.sha256

      - name: Upload exact dev18 sources artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModKit-Android-0.9.0-dev18-exact-sources
          path: |
            ModKit-Android-0.9.0-dev18-exact-sources.tar.gz
            ModKit-Android-0.9.0-dev18-exact-sources.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Python regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          cd "${MODKIT_DIR}"
          python -m pytest tests -q

      - name: ModKit selftest
        shell: bash
        run: |
          set -euo pipefail
          cd "${MODKIT_DIR}" && python -m modkit selftest

      - name: Runtime C++ contract check
        shell: bash
        run: |
          set -euo pipefail
          cd "${MODKIT_DIR}" && python -m modkit runtime-check

      - name: Build APK and lint
        shell: bash
        run: |
          set -euo pipefail
          cd "${MODKIT_DIR}/android"
          gradle --no-daemon :app:assembleDebug :app:lintDebug

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "${MODKIT_DIR}/android/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "${APK}" && test -s "${APK}"
          unzip -t "${APK}" >/dev/null
          "${ANDROID_HOME}/build-tools/34.0.0/zipalign" -c -p -v 4 "${APK}" >/dev/null
          cp "${APK}" ModKit-Android-0.9.0-dev18-debug.apk
          sha256sum ModKit-Android-0.9.0-dev18-debug.apk | tee ModKit-Android-0.9.0-dev18-debug.apk.sha256

      - name: Upload ModKit dev18 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModKit-Android-0.9.0-dev18-debug
          path: |
            ModKit-Android-0.9.0-dev18-debug.apk
            ModKit-Android-0.9.0-dev18-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
