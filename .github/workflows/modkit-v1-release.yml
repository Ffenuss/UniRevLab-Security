name: Publish ModKit 1.1.0-dev1 APK Release

on:
  push:
    branches: [ Modkit1 ]
    paths:
      - '.github/workflows/modkit-v1-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modkit-v1-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERSION: 1.1.0-dev1
      NDK_PIN: 26.1.10909125
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set release identity
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "TAG=modkit-${VERSION}-${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "APK_NAME=ModKit-Android-${VERSION}-${SHORT_SHA}-debug.apk" >> "$GITHUB_ENV"

      - name: Install Android toolchain
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' "ndk;${NDK_PIN}" 'cmake;3.22.1'

      - name: Python tests and runtime guards
        working-directory: v1
        run: |
          set -euo pipefail
          python -m pip install -U pip pytest
          python -m pytest tests -q
          python -m modkit selftest
          python -m modkit runtime-check

      - name: Android unit tests
        working-directory: v1/android
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Android javac
        working-directory: v1/android
        run: gradle --no-daemon :app:compileDebugJavaWithJavac

      - name: Android lint
        working-directory: v1/android
        run: gradle --no-daemon :app:lintDebug

      - name: Android assemble
        working-directory: v1/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Stage and verify APK
        shell: bash
        run: |
          set -euo pipefail
          SRC='v1/android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$SRC"
          unzip -t "$SRC" >/dev/null
          "${ANDROID_HOME}/build-tools/34.0.0/zipalign" -c -p -v 4 "$SRC" >/dev/null
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$SRC" | tee "apk-signature-${SHORT_SHA}.txt"
          cp "$SRC" "$APK_NAME"
          sha256sum "$APK_NAME" | tee "${APK_NAME}.sha256"
          stat -c 'APK size: %s bytes' "$APK_NAME"
          test "$(unzip -p "$APK_NAME" AndroidManifest.xml | wc -c)" -gt 0

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(cat <<EOF
          ModKit Android ${VERSION} validated development build.

          Source commit: ${GITHUB_SHA}
          Branch: Modkit1

          Release gate completed before publishing:
          - Python pytest suite
          - modkit selftest
          - modkit runtime-check
          - Android testDebugUnitTest
          - compileDebugJavaWithJavac
          - lintDebug
          - assembleDebug
          - APK unzip validation
          - zipalign verification
          - apksigner verification
          - SHA-256 generation

          This is a debug-signed test APK, not a production/store-signed package.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" "${APK_NAME}.sha256" "apk-signature-${SHORT_SHA}.txt" --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
              --title "ModKit Android ${VERSION} (${SHORT_SHA})" \
              --notes "$NOTES" \
              "$APK_NAME" \
              "${APK_NAME}.sha256" \
              "apk-signature-${SHORT_SHA}.txt"
          fi
