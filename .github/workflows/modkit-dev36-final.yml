name: Build ModKit 0.9.0-dev36 Final

on:
  push:
    branches: [ Modkit1 ]
    paths:
      - '.github/workflows/modkit-dev36-final.yml'
      - '.dev36/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      NDK_PIN: 26.3.11579264
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' "ndk;${NDK_PIN}" 'cmake;3.22.1'
      - name: Reconstruct, validate and build dev36
        run: bash .dev36/ci-dev36.sh
      - name: Stage and verify release artifacts
        run: |
          set -euo pipefail
          cd /tmp/modkit-dev25
          zip -qr "$GITHUB_WORKSPACE/ModKit-Android-0.9.0-dev36-exact-sources.zip" . \
            -x '.git/*' '.pytest_cache/*' '*/__pycache__/*' '*.pyc' \
               'android/.gradle/*' 'android/app/.cxx/*' 'android/app/build/*' 'build/*' '.re-cache/*' 'android/app/src/main/assets/samples/*'
          cd "$GITHUB_WORKSPACE"
          unzip -t ModKit-Android-0.9.0-dev36-exact-sources.zip >/dev/null
          if unzip -Z1 ModKit-Android-0.9.0-dev36-exact-sources.zip | grep -q '^android/app/.cxx/'; then
            echo 'ERROR: .cxx build intermediates leaked into exact sources' >&2; exit 1
          fi
          if unzip -Z1 ModKit-Android-0.9.0-dev36-exact-sources.zip | grep -q 'modkit-test-signing.p12'; then
            echo 'ERROR: legacy embedded signing private key leaked into exact sources' >&2; exit 1
          fi
          sha256sum ModKit-Android-0.9.0-dev36-exact-sources.zip > ModKit-Android-0.9.0-dev36-exact-sources.zip.sha256
          APK="$(find /tmp/modkit-dev25/android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK" && test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -p -v 4 "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK" >/dev/null
          if unzip -Z1 "$APK" | grep -q 'modkit-test-signing.p12'; then
            echo 'ERROR: legacy signing private key is embedded in APK' >&2; exit 1
          fi
          cp "$APK" ModKit-Android-0.9.0-dev36-debug.apk
          sha256sum ModKit-Android-0.9.0-dev36-debug.apk > ModKit-Android-0.9.0-dev36-debug.apk.sha256
      - name: Upload exact sources ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ModKit-Android-0.9.0-dev36-exact-sources
          path: |
            ModKit-Android-0.9.0-dev36-exact-sources.zip
            ModKit-Android-0.9.0-dev36-exact-sources.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModKit-Android-0.9.0-dev36-debug
          path: |
            ModKit-Android-0.9.0-dev36-debug.apk
            ModKit-Android-0.9.0-dev36-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
