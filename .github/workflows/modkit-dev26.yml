name: Build ModKit 0.9.0-dev26

on:
  push:
    branches: [ Modkit1 ]
    paths:
      - '.github/workflows/modkit-dev26.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NDK_PIN: 26.3.11579264
      DEV26_PATCH_GZ_SHA256: 714ee5438629af8bdb3bb35209571fb6925060164afa88cb6a470c6fd57c8bae
      DEV26_PATCH_SHA256: 4dd2ea4aacb6ba8d3e6ff768bbb345d48e183504b24b06c251001bb66504238b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' "ndk;${NDK_PIN}" 'cmake;3.22.1'

      - name: Reconstruct exact dev25 using the already-verified workflow recipe
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          import os, subprocess, yaml
          from pathlib import Path
          wf = yaml.safe_load(Path('.github/workflows/modkit-dev25.yml').read_text())
          build = wf['jobs']['build']
          env = os.environ.copy()
          env.update({str(k): str(v) for k,v in (build.get('env') or {}).items()})
          wanted = {
              'Reconstruct exact dev11', 'Apply dev16 through dev19',
              'Apply exact dev20', 'Verify and apply dev25 cumulative payload'
          }
          found=[]
          for step in build['steps']:
              if step.get('name') not in wanted: continue
              found.append(step['name'])
              script = step.get('run')
              if not script: raise SystemExit('missing run block: '+step['name'])
              print('== replay:', step['name'])
              subprocess.run(['bash','-euo','pipefail','-c',script], check=True, env=env)
          if set(found) != wanted:
              raise SystemExit('dev25 reconstruction recipe incomplete: '+repr(found))
          PY
          test -d /tmp/modkit-dev25
          grep -q "versionCode 30" /tmp/modkit-dev25/android/app/build.gradle
          grep -q "versionName '0.9.0-dev25'" /tmp/modkit-dev25/android/app/build.gradle

      - name: Verify and apply dev26 payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.ci/dev26-patch')
          m=json.loads((root/'MANIFEST.json').read_text())
          joined=b''
          for item in m['parts']:
              data=(root/item['name']).read_bytes()
              assert len(data)==item['size']
              assert hashlib.sha256(data).hexdigest()==item['sha256']
              joined += data
          assert len(joined)==m['b64_bytes']
          print('dev26 payload verified:',len(m['parts']),'parts')
          PY
          cat .ci/dev26-patch/part*.b64.part | tr -d '\r\n\t ' | base64 --decode > /tmp/dev26.patch.gz
          echo "${DEV26_PATCH_GZ_SHA256}  /tmp/dev26.patch.gz" | sha256sum -c -
          gunzip -c /tmp/dev26.patch.gz > /tmp/dev26.patch
          echo "${DEV26_PATCH_SHA256}  /tmp/dev26.patch" | sha256sum -c -
          cd /tmp/modkit-dev25
          git apply --check /tmp/dev26.patch
          git apply /tmp/dev26.patch
          grep -q "versionCode 31" android/app/build.gradle
          grep -q "versionName '0.9.0-dev26'" android/app/build.gradle
          grep -q 'version = "0.9.0.dev26"' pyproject.toml
          grep -q '__version__ = "0.9.0-dev26"' modkit/__init__.py
          test -f VALIDATION-DEV26.json
          test -f RELEASE-0.9.0-DEV26-RU.md

      - name: Full Python regression suite
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          cd /tmp/modkit-dev25
          python -m pytest tests -q

      - name: Selftest and runtime contract
        run: |
          set -euo pipefail
          cd /tmp/modkit-dev25
          python -m modkit selftest
          python -m modkit runtime-check

      - name: Build APK and lint
        run: |
          set -euo pipefail
          cd /tmp/modkit-dev25/android
          gradle --no-daemon :app:assembleDebug :app:lintDebug

      - name: Stage and verify artifacts
        run: |
          set -euo pipefail
          cd /tmp/modkit-dev25
          zip -qr "$GITHUB_WORKSPACE/ModKit-Android-0.9.0-dev26-exact-sources.zip" . \
            -x '.git/*' '.pytest_cache/*' '*/__pycache__/*' '*.pyc' 'android/.gradle/*' 'android/app/build/*' 'build/*'
          cd "$GITHUB_WORKSPACE"
          unzip -t ModKit-Android-0.9.0-dev26-exact-sources.zip >/dev/null
          sha256sum ModKit-Android-0.9.0-dev26-exact-sources.zip > ModKit-Android-0.9.0-dev26-exact-sources.zip.sha256
          APK="$(find /tmp/modkit-dev25/android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "${APK}" && test -s "${APK}"
          unzip -t "${APK}" >/dev/null
          "${ANDROID_HOME}/build-tools/34.0.0/zipalign" -c -p -v 4 "${APK}" >/dev/null
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --verbose "${APK}" >/dev/null
          cp "${APK}" ModKit-Android-0.9.0-dev26-debug.apk
          sha256sum ModKit-Android-0.9.0-dev26-debug.apk > ModKit-Android-0.9.0-dev26-debug.apk.sha256

      - name: Upload exact sources ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ModKit-Android-0.9.0-dev26-exact-sources
          path: |
            ModKit-Android-0.9.0-dev26-exact-sources.zip
            ModKit-Android-0.9.0-dev26-exact-sources.zip.sha256
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModKit-Android-0.9.0-dev26-debug
          path: |
            ModKit-Android-0.9.0-dev26-debug.apk
            ModKit-Android-0.9.0-dev26-debug.apk.sha256
          retention-days: 14
