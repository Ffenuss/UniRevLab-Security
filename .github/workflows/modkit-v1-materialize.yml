name: Materialize ModKit v1 Canonical Source

on:
  push:
    branches: [ Modkit1 ]
    paths:
      - '.github/workflows/modkit-v1-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      NDK_PIN: 26.3.11579264
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android toolchain
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' "ndk;${NDK_PIN}" 'cmake;3.22.1'
      - name: Reconstruct and validate exact dev40
        run: bash .dev40/ci-dev40.sh
      - name: Materialize canonical v1 source tree
        run: |
          set -euo pipefail
          test -d /tmp/modkit-dev25/modkit
          test -d /tmp/modkit-dev25/android
          rm -rf v1
          mkdir -p v1
          rsync -a \
            --exclude='.git/' \
            --exclude='.pytest_cache/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='android/.gradle/' \
            --exclude='android/app/build/' \
            --exclude='build/' \
            /tmp/modkit-dev25/ v1/
          find v1 -type f -print0 | sort -z | xargs -0 sha256sum > v1/SOURCE-SHA256SUMS.txt
          printf '%s\n' \
            'ModKit v1 canonical source baseline' \
            'Materialized from validated 0.9.0-dev40 without behavioral changes.' \
            'Historical .devXX transport is not part of the v1 build source of truth.' \
            > v1/CANONICAL-SOURCE.txt
          test -s v1/android/app/build.gradle
          test -s v1/modkit/mobile/simple_mode.py
          test -s v1/android/app/src/main/java/dev/modkit/mobile/WorkerService.java
      - name: Commit canonical source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v1
          if git diff --cached --quiet; then
            echo 'Canonical source already materialized'
            exit 0
          fi
          git commit -m 'v1: materialize canonical dev40 source baseline'
          git push origin HEAD:Modkit1
