name: Build UniRevLab v0.22 APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'native-core/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/**'
      - 'test-corpus/**'
      - '.github/workflows/bootstrap-v022.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply connected build fixes locally
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          for test_name in ("ElfNativeScannerTest.kt", "NativeRuleEngineTest.kt"):
              path = Path("app/src/test/java/org/unirevlab/security/analysis") / test_name
              source = path.read_text()
              bad = "\n".join([
                  '    private fun fixture(name: String): File {',
                  '        javaClass.classLoader?.getResource("fixtures/$name")?.let { return File(it.toURI()) }',
                  '        return File("app/src/test/resources/fixtures/$name").also {',
                  '            check(it.isFile) { "Missing native test fixture: ${it.absolutePath}" }',
                  '        }',
                  '    }',
              ])
              good = "\n".join([
                  '    private fun fixture(name: String): File {',
                  '        javaClass.classLoader?.getResource("fixtures/$name")?.let { return File(it.toURI()) }',
                  '        val candidates = listOf(',
                  '            File("src/test/resources/fixtures/$name"),',
                  '            File("app/src/test/resources/fixtures/$name"),',
                  '        )',
                  '        return candidates.firstOrNull { it.isFile }',
                  '            ?: error("Missing native test fixture: ${candidates.joinToString { it.absolutePath }}")',
                  '    }',
              ])
              if bad in source:
                  path.write_text(source.replace(bad, good))
              elif good not in source:
                  raise SystemExit(f"Unexpected fixture helper in {test_name}")

          manifest = Path("app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          if 'xmlns:tools="http://schemas.android.com/tools"' not in source:
              source = source.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:tools="http://schemas.android.com/tools">',
              )
          old_permission = '<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />'
          new_permission = '<uses-permission\n        android:name="android.permission.QUERY_ALL_PACKAGES"\n        tools:ignore="QueryAllPackagesPermission" />'
          if old_permission in source:
              source = source.replace(old_permission, new_permission)
          elif 'tools:ignore="QueryAllPackagesPermission"' not in source:
              raise SystemExit("Unexpected QUERY_ALL_PACKAGES declaration")
          manifest.write_text(source)
          PY
          git diff --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android 17 SDK 37.0 and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"
          test -f "${ANDROID_HOME}/platforms/android-37.0/android.jar"
          test -x "${ANDROID_HOME}/build-tools/36.0.0/aapt2"
          test -d "${ANDROID_HOME}/ndk/28.2.13676358"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install pinned cargo-ndk
        shell: bash
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build Rust JNI libraries
        shell: bash
        working-directory: native-core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          set -euo pipefail
          rm -rf ../app/src/main/jniLibs
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 \
            -o ../app/src/main/jniLibs \
            build --release

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Host preflight
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_schemas.py
          python scripts/check_secrets.py .

      - name: Build benign native fixtures
        shell: bash
        run: ./test-corpus/native/build-fixtures.sh

      - name: Unit tests, lint and APK build
        shell: bash
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "${APK}"
          unzip -t "${APK}" >/dev/null
          cp "${APK}" UniRevLab-Security-v0.22.0-debug.apk
          sha256sum UniRevLab-Security-v0.22.0-debug.apk | tee UniRevLab-Security-v0.22.0-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UniRevLab-Security-v0.22.0-debug
          path: |
            UniRevLab-Security-v0.22.0-debug.apk
            UniRevLab-Security-v0.22.0-debug.apk.sha256
          if-no-files-found: error
