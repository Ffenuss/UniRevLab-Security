name: Build UniRevLab v0.22 APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'native-core/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/**'
      - 'test-corpus/**'
      - '.github/workflows/bootstrap-v022.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply connected build fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          inspector = Path("app/src/main/java/org/unirevlab/security/analysis/LocalArtifactInspector.kt")
          text = inspector.read_text()
          old = "val fingerprints = BoundedDistinctCollector<org.unirevlab.security.model.RuntimeFileReference, Pair<String, String?>>(256) { it.entryName to it.sha256 }"
          new = "val fingerprints = BoundedDistinctCollector<org.unirevlab.security.model.RuntimeArtifactFingerprint, Pair<String, String>>(256) { it.entryName to it.sha256 }"
          if old in text:
              inspector.write_text(text.replace(old, new))
          elif new not in text:
              raise SystemExit("Unexpected RuntimeArtifactFingerprint merge source")

          for name in ("AgreementScreen.kt", "DashboardScreen.kt", "HelpScreen.kt", "InstalledAppsScreen.kt"):
              path = Path("app/src/main/java/org/unirevlab/security/ui") / name
              source = path.read_text()
              bad_import = "import androidx.compose.foundation.layout.weight\n"
              if bad_import in source:
                  path.write_text(source.replace(bad_import, ""))

          scanner = Path("app/src/main/java/org/unirevlab/security/analysis/RuntimeArtifactScanner.kt")
          source = scanner.read_text()
          old_classifier = "\n".join([
              '            if (n.contains("flutter_assets/")) flutterAssets += entry',
              '            if (base == "vm_snapshot_data" || base == "vm_snapshot_instr" || base == "isolate_snapshot_data" || base == "isolate_snapshot_instr") snapshots += entry',
              '            if (base == "kernel_blob.bin" || base.endsWith(".dill")) kernels += entry',
              '',
          ])
          new_classifier = "\n".join([
              '            val isFlutterSnapshot = base == "vm_snapshot_data" || base == "vm_snapshot_instr" || base == "isolate_snapshot_data" || base == "isolate_snapshot_instr"',
              '            val isFlutterKernel = base == "kernel_blob.bin" || base.endsWith(".dill")',
              '            if (n.contains("flutter_assets/") && !isFlutterSnapshot && !isFlutterKernel) flutterAssets += entry',
              '            if (isFlutterSnapshot) snapshots += entry',
              '            if (isFlutterKernel) kernels += entry',
              '',
          ])
          if old_classifier in source:
              scanner.write_text(source.replace(old_classifier, new_classifier))
          elif new_classifier not in source:
              raise SystemExit("Unexpected RuntimeArtifactScanner Flutter classifier")

          old_fixture = "\n".join([
              '    private fun fixture(name: String): File {',
              '        val url = checkNotNull(javaClass.classLoader?.getResource("fixtures/$name"))',
              '        return File(url.toURI())',
              '    }',
              '',
          ])
          new_fixture = "\n".join([
              '    private fun fixture(name: String): File {',
              '        javaClass.classLoader?.getResource("fixtures/$name")?.let { return File(it.toURI()) }',
              '        return File("app/src/test/resources/fixtures/$name").also {',
              '            check(it.isFile) { "Missing native test fixture: ${it.absolutePath}" }',
              '        }',
              '    }',
              '',
          ])
          for test_name in ("ElfNativeScannerTest.kt", "NativeRuleEngineTest.kt"):
              test_path = Path("app/src/test/java/org/unirevlab/security/analysis") / test_name
              test_source = test_path.read_text()
              if old_fixture in test_source:
                  test_path.write_text(test_source.replace(old_fixture, new_fixture))
              elif new_fixture not in test_source:
                  raise SystemExit(f"Unexpected fixture helper in {test_name}")
          PY

          git diff --check
          if ! git diff --quiet -- app/src; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src
            git commit -m "Fix connected unit test regressions [skip ci]"
            git push origin HEAD:main
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android 17 SDK 37.0 and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"
          test -f "${ANDROID_HOME}/platforms/android-37.0/android.jar"
          test -x "${ANDROID_HOME}/build-tools/36.0.0/aapt2"
          test -d "${ANDROID_HOME}/ndk/28.2.13676358"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install pinned cargo-ndk
        shell: bash
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build Rust JNI libraries
        shell: bash
        working-directory: native-core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          set -euo pipefail
          rm -rf ../app/src/main/jniLibs
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 \
            -o ../app/src/main/jniLibs \
            build --release

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Host preflight
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_schemas.py
          python scripts/check_secrets.py .

      - name: Build benign native fixtures
        shell: bash
        run: ./test-corpus/native/build-fixtures.sh

      - name: Unit tests, lint and APK build
        shell: bash
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "${APK}"
          unzip -t "${APK}" >/dev/null
          cp "${APK}" UniRevLab-Security-v0.22.0-debug.apk
          sha256sum UniRevLab-Security-v0.22.0-debug.apk | tee UniRevLab-Security-v0.22.0-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UniRevLab-Security-v0.22.0-debug
          path: |
            UniRevLab-Security-v0.22.0-debug.apk
            UniRevLab-Security-v0.22.0-debug.apk.sha256
          if-no-files-found: error
