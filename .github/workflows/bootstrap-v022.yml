name: Android CI

on:
  push:
    branches: ["fix-analysis-progress-v0221"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.25.9 AutoMod target resolution
        run: python tools/apply_v0259_automod_navigation.py

      - name: Apply v0.25.9 compact Patch Lab navigation
        run: python tools/apply_v0259_compact_patchlab.py

      - name: Apply v0.25.9 Runtime State UX
        run: python tools/apply_v0259_runtime_binding.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK + NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust JNI libraries
        shell: bash
        run: |
          rm -rf app/src/main/jniLibs
          mkdir -p app/src/main/jniLibs
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 -o app/src/main/jniLibs build --manifest-path native-core/Cargo.toml --release

      - name: Host preflight
        shell: bash
        run: |
          python scripts/check_secrets.py
          python scripts/check_android_build_config.py

      - name: Build native fixtures
        shell: bash
        run: |
          bash test-corpus/native/build-fixtures.sh
          bash test-corpus/native/build-multiabi-fixtures.sh

      - name: Unit tests + lint + APK build
        shell: bash
        run: |
          chmod +x gradlew || true
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee UniRevLab-Security-v0.25.9-automod-navigation-debug.apk.sha256
          cp "$APK" UniRevLab-Security-v0.25.9-automod-navigation-debug.apk

      - name: Commit verified v0.25.9 sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/java/org/unirevlab/security/analysis/AutoModEngine.kt app/src/main/java/org/unirevlab/security/ui/AutoModPanel.kt app/src/main/java/org/unirevlab/security/ui/PatchLabScreen.kt app/src/main/java/org/unirevlab/security/ui/RuntimeStateLabPanel.kt app/src/test/java/org/unirevlab/security/analysis/AutoModEngineTest.kt
          if ! git diff --cached --quiet; then
            git commit -m "Improve AutoMod target resolution and compact Patch Lab [skip ci]"
            git push origin HEAD:fix-analysis-progress-v0221
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniRevLab-Security-v0.25.9-automod-navigation-debug
          path: |
            UniRevLab-Security-v0.25.9-automod-navigation-debug.apk
            UniRevLab-Security-v0.25.9-automod-navigation-debug.apk.sha256
          if-no-files-found: error
