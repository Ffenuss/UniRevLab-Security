name: Build UniRevLab v0.25.7 Full Picker APK

on:
  push:
    branches: [ fix-analysis-progress-v0221 ]
    paths:
      - 'app/**'
      - 'native-core/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/**'
      - '.ci/**'
      - 'tools/**'
      - 'test-corpus/**'
      - '.github/workflows/bootstrap-v022.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v0.25.7 full picker wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.25.6-dev-runtime-state-lab"' app/build.gradle.kts
          python tools/apply_v0257_full_pickers_safe.py
          grep -q 'versionName = "0.25.7-dev-full-pickers"' app/build.gradle.kts
          test -f app/src/main/java/org/unirevlab/security/ui/PatchLabPickerDialogs.kt
          grep -q 'LazyColumn' app/src/main/java/org/unirevlab/security/ui/PatchLabPickerDialogs.kt
          grep -q 'title = "DEX-файлы"' app/src/main/java/org/unirevlab/security/ui/PatchLabScreen.kt
          grep -q 'title = "Классы DEX"' app/src/main/java/org/unirevlab/security/ui/PatchLabScreen.kt
          grep -q 'PatchMethodPickerDialog(' app/src/main/java/org/unirevlab/security/ui/PatchLabScreen.kt
          grep -q 'title = "Файлы внутри APK"' app/src/main/java/org/unirevlab/security/ui/PatchLabScreen.kt
          ! grep -q 'classes.take(24)' app/src/main/java/org/unirevlab/security/ui/PatchLabScreen.kt
          ! grep -q 'classes.take(25)' app/src/main/java/org/unirevlab/security/ui/PatchLabScreen.kt
          ! grep -q '.take(80)' app/src/main/java/org/unirevlab/security/ui/PatchLabScreen.kt
          ! grep -q '.take(160)' app/src/main/java/org/unirevlab/security/ui/PatchLabScreen.kt
          ! grep -q 'nativeEntries.take(20)' app/src/main/java/org/unirevlab/security/ui/PatchLabScreen.kt
          grep -q 'RuntimeStateLabPanel(' app/src/main/java/org/unirevlab/security/ui/PatchLabScreen.kt
          grep -q 'TamperAssessmentPanelV2(' app/src/main/java/org/unirevlab/security/ui/PatchLabScreen.kt
          git diff --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android 17 SDK 37.0 and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"
          test -f "${ANDROID_HOME}/platforms/android-37.0/android.jar"
          test -x "${ANDROID_HOME}/build-tools/36.0.0/aapt2"
          test -d "${ANDROID_HOME}/ndk/28.2.13676358"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install pinned cargo-ndk
        shell: bash
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build Rust JNI libraries
        shell: bash
        working-directory: native-core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          set -euo pipefail
          rm -rf ../app/src/main/jniLibs
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 \
            -o ../app/src/main/jniLibs \
            build --release

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Host preflight
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_schemas.py
          python scripts/check_secrets.py .

      - name: Build benign native fixtures
        shell: bash
        run: ./test-corpus/native/build-fixtures.sh

      - name: Unit tests, lint and APK build
        shell: bash
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "${APK}"
          unzip -t "${APK}" >/dev/null
          cp "${APK}" UniRevLab-Security-v0.25.7-full-pickers-debug.apk
          sha256sum UniRevLab-Security-v0.25.7-full-pickers-debug.apk | tee UniRevLab-Security-v0.25.7-full-pickers-debug.apk.sha256

      - name: Commit verified v0.25.7 source patch
        if: github.ref_name == 'fix-analysis-progress-v0221'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- app/src app/build.gradle.kts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src app/build.gradle.kts
            git commit -m "Integrate full Patch Lab pickers without list caps [skip ci]"
            git push origin HEAD:fix-analysis-progress-v0221
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UniRevLab-Security-v0.25.7-full-pickers-debug
          path: |
            UniRevLab-Security-v0.25.7-full-pickers-debug.apk
            UniRevLab-Security-v0.25.7-full-pickers-debug.apk.sha256
          if-no-files-found: error
