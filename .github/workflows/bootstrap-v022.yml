name: Build UniRevLab v0.25.9 AutoMod Navigation APK

on:
  push:
    branches: [ fix-analysis-progress-v0221 ]
    paths:
      - 'app/**'
      - 'native-core/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/**'
      - 'tools/**'
      - 'test-corpus/**'
      - '.github/workflows/bootstrap-v022.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.25.9 AutoMod target resolution
        run: python tools/apply_v0259_automod_navigation.py

      - name: Apply v0.25.9 compact Patch Lab navigation
        run: python tools/apply_v0259_compact_patchlab.py

      - name: Apply v0.25.9 Runtime State UX
        run: python tools/apply_v0259_runtime_binding.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 SDK 37.0 and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"
          test -f "${ANDROID_HOME}/platforms/android-37.0/android.jar"
          test -x "${ANDROID_HOME}/build-tools/36.0.0/aapt2"
          test -d "${ANDROID_HOME}/ndk/28.2.13676358"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install pinned cargo-ndk
        shell: bash
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build Rust JNI libraries
        shell: bash
        working-directory: native-core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          set -euo pipefail
          rm -rf ../app/src/main/jniLibs
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 \
            -o ../app/src/main/jniLibs \
            build --release

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Host preflight
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_schemas.py
          python scripts/check_secrets.py .
          python scripts/check_android_build_config.py

      - name: Build native fixtures
        shell: bash
        run: |
          set -euo pipefail
          bash test-corpus/native/build-fixtures.sh
          bash test-corpus/native/build-multiabi-fixtures.sh

      - name: Unit tests + lint + APK build
        shell: bash
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "${APK}"
          test -s "${APK}"
          unzip -t "${APK}" >/dev/null
          cp "${APK}" UniRevLab-Security-v0.25.9-automod-navigation-debug.apk
          sha256sum UniRevLab-Security-v0.25.9-automod-navigation-debug.apk | tee UniRevLab-Security-v0.25.9-automod-navigation-debug.apk.sha256

      - name: Commit verified v0.25.9 sources
        if: github.ref_name == 'fix-analysis-progress-v0221'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/java/org/unirevlab/security/analysis/AutoModEngine.kt app/src/main/java/org/unirevlab/security/ui/AutoModPanel.kt app/src/main/java/org/unirevlab/security/ui/PatchLabScreen.kt app/src/main/java/org/unirevlab/security/ui/RuntimeStateLabPanel.kt app/src/test/java/org/unirevlab/security/analysis/AutoModEngineTest.kt
          if ! git diff --cached --quiet; then
            git commit -m "Improve AutoMod target resolution and compact Patch Lab (run ${{ github.run_id }}) [skip ci]"
          else
            git commit --allow-empty -m "Verify v0.25.9 sources (run ${{ github.run_id }}) [skip ci]"
          fi
          git push origin HEAD:fix-analysis-progress-v0221

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniRevLab-Security-v0.25.9-automod-navigation-debug
          path: |
            UniRevLab-Security-v0.25.9-automod-navigation-debug.apk
            UniRevLab-Security-v0.25.9-automod-navigation-debug.apk.sha256
          if-no-files-found: error
