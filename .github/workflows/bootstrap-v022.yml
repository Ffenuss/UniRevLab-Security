name: Build UniRevLab v0.34.0 IL2CPP Semantic Preview APK

on:
  push:
    branches: [ fix-analysis-progress-v0221 ]
    paths:
      - 'app/**'
      - 'testtarget/**'
      - 'native-core/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/**'
      - 'tools/**'
      - 'test-corpus/**'
      - '.github/workflows/bootstrap-v022.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v0340-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record CI run id
        if: github.ref_name == 'fix-analysis-progress-v0221'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Start v0.34.0 CI run ${{ github.run_id }} [skip ci]"
          git push origin HEAD:fix-analysis-progress-v0221

      - name: Apply v0.30.0 full reconstructed mapping
        run: python tools/apply_v0300_full_mapping.py

      - name: Apply v0.31.0 semantic recovery quality layer
        run: python tools/apply_v0310_semantic_recovery.py

      - name: Apply v0.32.0 durable history UI
        run: python tools/apply_v0320_durable_history_ui.py

      - name: Apply v0.33.0 IL2CPP pair reconstruction
        run: python tools/apply_v0330_il2cpp_pair.py

      - name: Apply v0.33.0 IL2CPP pair workspace UI
        run: python tools/apply_v0331_il2cpp_ui.py

      - name: Normalize v0.33.0 IL2CPP workspace compile state
        run: python tools/apply_v0332_il2cpp_compile_guard.py

      - name: Apply v0.34.0 IL2CPP semantic analyst mapping
        run: python tools/apply_v0340_il2cpp_semantic_mapping.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 SDK 37.0 and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"
          test -f "${ANDROID_HOME}/platforms/android-37.0/android.jar"
          test -x "${ANDROID_HOME}/build-tools/36.0.0/aapt2"
          test -x "${ANDROID_HOME}/build-tools/36.0.0/zipalign"
          test -d "${ANDROID_HOME}/ndk/28.2.13676358"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install pinned cargo-ndk
        shell: bash
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build Rust JNI libraries
        shell: bash
        working-directory: native-core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          set -euo pipefail
          rm -rf ../app/src/main/jniLibs
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 \
            -o ../app/src/main/jniLibs \
            build --release

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Host preflight
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_schemas.py
          python scripts/check_secrets.py .
          python scripts/check_android_build_config.py

      - name: Build native fixtures
        shell: bash
        run: |
          set -euo pipefail
          bash test-corpus/native/build-fixtures.sh
          bash test-corpus/native/build-multiabi-fixtures.sh

      - name: Unit tests + lint + APK builds
        shell: bash
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :testtarget:assembleDebug

      - name: Verify APKs
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          TARGET_APK="$(find testtarget/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "${APK}"
          test -s "${APK}"
          test -n "${TARGET_APK}"
          test -s "${TARGET_APK}"
          unzip -t "${APK}" >/dev/null
          unzip -t "${TARGET_APK}" >/dev/null
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "${APK}" >/dev/null
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "${TARGET_APK}" >/dev/null
          cp "${APK}" UniRevLab-Security-v0.34.0-il2cpp-semantic-preview-debug.apk
          cp "${TARGET_APK}" UniRevLab-TestTarget-v1.0-debug.apk
          sha256sum UniRevLab-Security-v0.34.0-il2cpp-semantic-preview-debug.apk | tee UniRevLab-Security-v0.34.0-il2cpp-semantic-preview-debug.apk.sha256
          sha256sum UniRevLab-TestTarget-v1.0-debug.apk | tee UniRevLab-TestTarget-v1.0-debug.apk.sha256

      - name: Commit verified v0.34.0 sources
        if: github.ref_name == 'fix-analysis-progress-v0221'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/java/org/unirevlab/security/MainActivity.kt \
            app/src/main/java/org/unirevlab/security/model/StaticAnalysisModels.kt \
            app/src/main/java/org/unirevlab/security/model/ProjectHistoryModels.kt \
            app/src/main/java/org/unirevlab/security/analysis/DexStringScanner.kt \
            app/src/main/java/org/unirevlab/security/analysis/FullMappingEngine.kt \
            app/src/main/java/org/unirevlab/security/analysis/SemanticRecoveryEngine.kt \
            app/src/main/java/org/unirevlab/security/analysis/AnalysisManager.kt \
            app/src/main/java/org/unirevlab/security/analysis/AnalysisRunState.kt \
            app/src/main/java/org/unirevlab/security/analysis/LocalArtifactInspector.kt \
            app/src/main/java/org/unirevlab/security/analysis/Il2CppScanner.kt \
            app/src/main/java/org/unirevlab/security/analysis/Il2CppMonetizationRiskEngine.kt \
            app/src/main/java/org/unirevlab/security/analysis/Il2CppSemanticMappingEngine.kt \
            app/src/main/java/org/unirevlab/security/analysis/Il2CppManagedDumpExporter.kt \
            app/src/main/java/org/unirevlab/security/analysis/Il2CppPairAssessmentEngine.kt \
            app/src/main/java/org/unirevlab/security/data/AssessmentHistoryStore.kt \
            app/src/main/java/org/unirevlab/security/data/ReportSnapshotCodec.kt \
            app/src/main/java/org/unirevlab/security/ui/AutomaticDeobfuscationPanel.kt \
            app/src/main/java/org/unirevlab/security/ui/ProjectHistoryScreen.kt \
            app/src/main/java/org/unirevlab/security/ui/ProductToolsScreen.kt \
            app/src/main/java/org/unirevlab/security/ui/Il2CppPairWorkspaceScreen.kt \
            app/src/test/java/org/unirevlab/security/analysis/FullMappingEngineTest.kt \
            app/src/test/java/org/unirevlab/security/analysis/SemanticRecoveryEngineTest.kt \
            app/src/test/java/org/unirevlab/security/analysis/Il2CppMonetizationRiskEngineTest.kt \
            app/src/test/java/org/unirevlab/security/analysis/Il2CppSemanticMappingEngineTest.kt \
            app/src/test/java/org/unirevlab/security/data/ReportSnapshotCodecTest.kt
          if ! git diff --cached --quiet; then
            git commit -m "Apply v0.34.0 IL2CPP semantic mapping (run ${{ github.run_id }}) [skip ci]"
          else
            git commit --allow-empty -m "Verify v0.34.0 sources (run ${{ github.run_id }}) [skip ci]"
          fi
          git push origin HEAD:fix-analysis-progress-v0221

      - name: Upload UniRevLab APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniRevLab-Security-v0.34.0-il2cpp-semantic-preview-debug
          path: |
            UniRevLab-Security-v0.34.0-il2cpp-semantic-preview-debug.apk
            UniRevLab-Security-v0.34.0-il2cpp-semantic-preview-debug.apk.sha256
          if-no-files-found: error

      - name: Upload TestTarget APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniRevLab-TestTarget-v1.0-debug
          path: |
            UniRevLab-TestTarget-v1.0-debug.apk
            UniRevLab-TestTarget-v1.0-debug.apk.sha256
          if-no-files-found: error
