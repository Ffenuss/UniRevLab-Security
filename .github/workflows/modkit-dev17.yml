name: Build ModKit 0.9.0-dev17 APK

on:
  push:
    branches: [ Modkit1 ]
    paths:
      - '.ci/dev17-patch/**'
      - '.github/workflows/modkit-dev17.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-modkit-dev17:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NDK_PIN: 26.3.11579264
      MODKIT_DIR: /tmp/modkit-dev17
      DEV11_PATCH_GZ: /tmp/ModKit-dev11.patch.gz
      DEV11_PATCH: /tmp/ModKit-dev11.patch
      DEV11_PATCH_GZ_SHA256: a884617ea250eceaecc1a8b6e6788ba14cfbbe93249446667f7595d3120af922
      DEV11_PATCH_SHA256: 46ca0c8fc395e75a3bdbdc7d75cd7d12743b371c7b98c6a9b89ac0e7ca91ca33
      BASE_SHA256: 71b51b27b63a75653b68a81de6feadc337e2dbe5e6b8ef521aa5082601009cef
      DEV16_PATCH_B64_RAW: /tmp/ModKit-dev16.patch.gz.b64.raw
      DEV16_PATCH_B64: /tmp/ModKit-dev16.patch.gz.b64
      DEV16_PATCH_GZ: /tmp/ModKit-dev16.patch.gz
      DEV16_PATCH: /tmp/ModKit-dev16.patch
      DEV16_PATCH_GZ_SHA256: f679898195a7bec5d8a9d0ff4836c7befbb9ac4fb9c8d142b8868fb1e5810b27
      DEV16_PATCH_SHA256: 67a3a1cd456b13216395bbff87c73e4eb652dd9f62770d59da9404fd3f4a01ac
      DEV17_PATCH_B64_RAW: /tmp/ModKit-dev17.patch.gz.b64.raw
      DEV17_PATCH_B64: /tmp/ModKit-dev17.patch.gz.b64
      DEV17_PATCH_GZ: /tmp/ModKit-dev17.patch.gz
      DEV17_PATCH: /tmp/ModKit-dev17.patch
      DEV17_PATCH_GZ_SHA256: 5a2de96d1a1f741d3ff8f2f9cd370a08ae6ca61ba797b09ab5b9c848a94734a4
      DEV17_PATCH_SHA256: c02062c391320b50b82bdb5fc859ad45650afcd4ca5f2b9d8ac8f66cd5647736
    steps:
      - name: Checkout Modkit1
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            "ndk;${NDK_PIN}" \
            'cmake;3.22.1'

      - name: Reconstruct exact ModKit dev11 base
        shell: bash
        run: |
          set -euo pipefail
          echo "${BASE_SHA256}  ModKit-Android-0.9.0-dev10-sources.zip" | sha256sum -c -
          rm -rf "${MODKIT_DIR}"
          mkdir -p "${MODKIT_DIR}"
          unzip -q ModKit-Android-0.9.0-dev10-sources.zip -d "${MODKIT_DIR}"
          test -f "${MODKIT_DIR}/android/settings.gradle"
          test -f "${MODKIT_DIR}/android/app/build.gradle"
          python .ci/patch_modkit_android_compat.py "${MODKIT_DIR}"
          cat .ci/dev11-patch/part00.gz.part \
              .ci/dev11-patch/part01.gz.part \
              .ci/dev11-patch/part02.gz.part \
              .ci/dev11-patch/part03.gz.part > "${DEV11_PATCH_GZ}"
          echo "${DEV11_PATCH_GZ_SHA256}  ${DEV11_PATCH_GZ}" | sha256sum -c -
          gunzip -c "${DEV11_PATCH_GZ}" > "${DEV11_PATCH}"
          echo "${DEV11_PATCH_SHA256}  ${DEV11_PATCH}" | sha256sum -c -
          cd "${MODKIT_DIR}"
          git apply --check "${DEV11_PATCH}"
          git apply "${DEV11_PATCH}"
          grep -q "versionCode 18" android/app/build.gradle
          grep -q "versionName '0.9.0-dev11'" android/app/build.gradle

      - name: Apply exact dev16 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/dev16-patch/part00.b64.part \
              .ci/dev16-patch/part01.b64.part \
              .ci/dev16-patch/part02.b64.part \
              .ci/dev16-patch/part03.b64.part \
              .ci/dev16-patch/part04.b64.part \
              .ci/dev16-patch/part05.b64.part \
              .ci/dev16-patch/part06.b64.part \
              .ci/dev16-patch/part07.b64.part > "${DEV16_PATCH_B64_RAW}"
          tr -d '\r\n\t ' < "${DEV16_PATCH_B64_RAW}" > "${DEV16_PATCH_B64}"
          base64 --decode "${DEV16_PATCH_B64}" > "${DEV16_PATCH_GZ}"
          echo "${DEV16_PATCH_GZ_SHA256}  ${DEV16_PATCH_GZ}" | sha256sum -c -
          gunzip -c "${DEV16_PATCH_GZ}" > "${DEV16_PATCH}"
          echo "${DEV16_PATCH_SHA256}  ${DEV16_PATCH}" | sha256sum -c -
          cd "${MODKIT_DIR}"
          git apply --check "${DEV16_PATCH}"
          git apply "${DEV16_PATCH}"
          grep -q "versionCode 23" android/app/build.gradle
          grep -q "versionName '0.9.0-dev16'" android/app/build.gradle

      - name: Apply dev17 large-result stability patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/dev17-patch/part00.b64.part \
              .ci/dev17-patch/part01.b64.part > "${DEV17_PATCH_B64_RAW}"
          tr -d '\r\n\t ' < "${DEV17_PATCH_B64_RAW}" > "${DEV17_PATCH_B64}"
          base64 --decode "${DEV17_PATCH_B64}" > "${DEV17_PATCH_GZ}"
          echo "${DEV17_PATCH_GZ_SHA256}  ${DEV17_PATCH_GZ}" | sha256sum -c -
          gunzip -c "${DEV17_PATCH_GZ}" > "${DEV17_PATCH}"
          echo "${DEV17_PATCH_SHA256}  ${DEV17_PATCH}" | sha256sum -c -
          cd "${MODKIT_DIR}"
          git apply --check "${DEV17_PATCH}"
          git apply "${DEV17_PATCH}"
          grep -q "versionCode 24" android/app/build.gradle
          grep -q "versionName '0.9.0-dev17'" android/app/build.gradle
          grep -q 'version = "0.9.0.dev17"' pyproject.toml
          grep -q '__version__ = "0.9.0-dev17"' modkit/__init__.py
          test -f VALIDATION-DEV17.json

      - name: Stage exact dev17 sources
        shell: bash
        run: |
          set -euo pipefail
          tar -C "${MODKIT_DIR}" -czf ModKit-Android-0.9.0-dev17-exact-sources.tar.gz .
          sha256sum ModKit-Android-0.9.0-dev17-exact-sources.tar.gz | tee ModKit-Android-0.9.0-dev17-exact-sources.tar.gz.sha256

      - name: Upload exact dev17 sources artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModKit-Android-0.9.0-dev17-exact-sources
          path: |
            ModKit-Android-0.9.0-dev17-exact-sources.tar.gz
            ModKit-Android-0.9.0-dev17-exact-sources.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Python regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          cd "${MODKIT_DIR}"
          python -m pytest tests -q

      - name: ModKit selftest
        shell: bash
        run: |
          set -euo pipefail
          cd "${MODKIT_DIR}"
          python -m modkit selftest

      - name: Runtime C++ contract check
        shell: bash
        run: |
          set -euo pipefail
          cd "${MODKIT_DIR}"
          python -m modkit runtime-check

      - name: Build APK and lint
        shell: bash
        run: |
          set -euo pipefail
          cd "${MODKIT_DIR}/android"
          gradle --no-daemon :app:assembleDebug :app:lintDebug

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "${MODKIT_DIR}/android/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "${APK}"
          test -s "${APK}"
          unzip -t "${APK}" >/dev/null
          "${ANDROID_HOME}/build-tools/34.0.0/zipalign" -c -p -v 4 "${APK}" >/dev/null
          cp "${APK}" ModKit-Android-0.9.0-dev17-debug.apk
          sha256sum ModKit-Android-0.9.0-dev17-debug.apk | tee ModKit-Android-0.9.0-dev17-debug.apk.sha256
          ls -lh ModKit-Android-0.9.0-dev17-debug.apk

      - name: Upload ModKit dev17 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModKit-Android-0.9.0-dev17-debug
          path: |
            ModKit-Android-0.9.0-dev17-debug.apk
            ModKit-Android-0.9.0-dev17-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
