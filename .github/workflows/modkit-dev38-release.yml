name: Publish ModKit 0.9.0-dev38 APK Release

on:
  push:
    branches: [ Modkit1 ]
    paths:
      - '.github/workflows/modkit-dev38-release.yml'
      - '.dev38/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      NDK_PIN: 26.3.11579264
      TAG: modkit-0.9.0-dev38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' "ndk;${NDK_PIN}" 'cmake;3.22.1'
      - name: Reconstruct, validate and build dev38
        run: bash .dev38/ci-dev38.sh
      - name: Stage and verify APK
        run: |
          set -euo pipefail
          APK="$(find /tmp/modkit-dev25/android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK" && test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -p -v 4 "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK" >/dev/null
          cp "$APK" ModKit-Android-0.9.0-dev38-debug.apk
          sha256sum ModKit-Android-0.9.0-dev38-debug.apk > ModKit-Android-0.9.0-dev38-debug.apk.sha256
          cat ModKit-Android-0.9.0-dev38-debug.apk.sha256
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ModKit-Android-0.9.0-dev38-debug.apk ModKit-Android-0.9.0-dev38-debug.apk.sha256 --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title 'ModKit Android 0.9.0-dev38' \
              --notes 'dev38: passive API/server endpoint + TLS/network/crypto/key-marker audit, target-specific READY labels, fail-closed auto-build. Full pytest, selftest, runtime-check, assembleDebug, lintDebug, zipalign and APK signature verification.' \
              ModKit-Android-0.9.0-dev38-debug.apk ModKit-Android-0.9.0-dev38-debug.apk.sha256
          fi
