name: Wire ModKit v1 External Evidence

on:
  push:
    branches: [ Modkit1 ]
    paths:
      - '.github/workflows/v1-wire-external-evidence.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Modkit1
      - name: Add external evidence to Simple Mode
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v1/modkit/mobile/simple_mode.py')
          s=p.read_text(encoding='utf-8')
          anchor='''                add(_quality(card))\n\n    sources = [\n'''
          block='''                add(_quality(card))\n\n    for external_path in sorted(root.glob("external-evidence-*.json")):\n        external = _json(external_path)\n        if not isinstance(external, dict):\n            continue\n        for row in external.get("findings", []) or []:\n            if not isinstance(row, dict):\n                continue\n            card = _generic_card(row, "ExternalEngine", str(row.get("category") or "External Evidence"))\n            if card:\n                card["externalCorroborating"] = True\n                card["buildable"] = False\n                card["selectable"] = False\n                card["actionable"] = False\n                card["locator"] = None\n                card["status"] = "IMPORTED_EVIDENCE"\n                card["description"] = str(row.get("description") or "Imported external-engine evidence; requires local confirmation before READY.")\n                add(_quality(card))\n\n    sources = [\n'''
          if 'root.glob("external-evidence-*.json")' not in s:
              if anchor not in s: raise SystemExit('artifact/source anchor not found')
              s=s.replace(anchor,block)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'ModKit CI'
          git config user.email 'actions@users.noreply.github.com'
          git add v1/modkit/mobile/simple_mode.py
          git diff --cached --quiet && exit 0
          git commit -m 'v1: correlate external engine evidence in Simple Mode'
          git push origin HEAD:Modkit1
