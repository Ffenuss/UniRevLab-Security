name: Android ModKit
on:
  workflow_dispatch:
  push:
    paths: ['android/**', 'modkit/**', 'tests/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['android/**', 'modkit/**', 'tests/**', '.github/workflows/mobile.yml']
env:
  NDK_PIN: 26.3.11579264

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: python -m pip install pytest
      - run: python -m pytest tests -q
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' "ndk;${NDK_PIN}" 'cmake;3.22.1'
      - run: gradle --no-daemon assembleDebug lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: ModKit-Android-0.9.0-dev8
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
