name: android

# Regenerates the demo module from demo/target/, then builds the loader APK with the
# pinned NDK. Same steps work for a real target: drop the game's dump.cs +
# global-metadata.dat + libil2cpp.so into a target dir and adjust --package/--app.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_PIN: 26.3.11579264
  SDK_PIN: 34

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: test suite + selftest (host g++ over every generated TU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest tests -q
          python -m modkit selftest

  apk:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"          # AGP 8.5.2 needs Gradle >= 8.7
          cache-read-only: true

      - name: install platform + pinned ndk
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-${SDK_PIN}" \
            "build-tools;${SDK_PIN}.0.0" "ndk;${NDK_PIN}" "cmake;3.22.1"

      - name: regenerate the module from demo/target
        run: |
          python -m pip install -e .
          python -m modkit build \
            --dump demo/target/dump.cs \
            --metadata demo/target/global-metadata.dat \
            --so demo/target/libil2cpp.so \
            --out demo/neon-drift \
            --package com.neondrift.game --app neondrift \
            --verify --force --no-dumper

      - name: assembleDebug
        working-directory: demo/neon-drift
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: loader-apk-debug
          path: demo/neon-drift/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: standalone native build (no gradle)
        working-directory: demo/neon-drift
        run: |
          export ANDROID_NDK="$ANDROID_HOME/ndk/$NDK_PIN"
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          bash build.sh
          find build -name "*.so" -printf "%p  %s bytes\n"

      - uses: actions/upload-artifact@v4
        with:
          name: native-lib-arm64
          path: demo/neon-drift/build/arm64-v8a/*.so
          if-no-files-found: ignore
