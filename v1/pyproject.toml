# Active release: 1.0.0. Historical regression baseline marker only: version = "0.9.0.dev40"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modkit"
version = "1.0.0"
description = "Offline Android application/game analysis, reverse-engineering, evidence and rooted runtime inspection toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
modkit = "modkit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["modkit*"]

[tool.setuptools.package-data]
modkit = ["../rules/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]