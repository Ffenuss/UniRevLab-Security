// Active development: ModKit 1.1.0-dev1, versionCode 47.
// Prior canonical release marker retained for regression guards only: versionCode 46, versionName '1.0.0'.
// Historical canonical baseline retained only for regression provenance: versionCode 45, versionName '0.9.0-dev40'.
plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
    namespace 'dev.modkit.mobile'
    compileSdk 34
    ndkVersion '26.1.10909125'
    defaultConfig {
        applicationId 'dev.modkit.mobile'
        minSdk 26
        targetSdk 34
        multiDexEnabled true
        versionCode 47
        versionName '1.1.0-dev1'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt') } }
    packagingOptions {
        jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/librodroid.so'] }
    }
    signingConfigs { debug { storeFile file('../keystore/modkit-debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.android.tools.build:apksig:8.5.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'io.github.skylot:jadx-core:1.5.6'
    implementation 'io.github.skylot:jadx-dex-input:1.5.6'
    implementation 'org.apktool:apktool-lib:3.0.2'
    implementation 'com.github.tony19:logback-android:3.0.0'
}
chaquopy {
    defaultConfig {
        version = '3.12'
        pip {
            // Pure-Python Hermes HBC disassembler, bundled into the APK at build time.
            install 'hbctool==0.1.5'
        }
    }
    sourceSets { main { srcDir '../../'; include 'modkit/**'; include 'rules/**'; exclude '**/__pycache__/**' } }
}